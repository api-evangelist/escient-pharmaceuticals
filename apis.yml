name: Escient Pharmaceuticals
description: 'Escient Pharmaceuticals is a San Diego, California clinical-stage biopharmaceutical company
  developing first-in-class, oral small-molecule therapeutics targeting Mas-related G protein-coupled receptors
  (MRGPRs) along the neurosensory-inflammatory axis. Its lead programs are EP262, an MRGPRX2 antagonist for
  mast-cell-mediated diseases such as chronic spontaneous and inducible urticaria and atopic dermatitis, and
  EP547, an MRGPRX4 antagonist for cholestatic and uremic pruritus. The company was backed by New Enterprise
  Associates (NEA) and was acquired by Incyte Corporation on May 30, 2024. Escient operates a corporate
  marketing website only and publishes no public API, developer program, or machine-readable API specification;
  this profile captures its identity and domain-security posture for the API Evangelist network.'
